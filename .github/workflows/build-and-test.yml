---
name: dzil build and test

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    container:
      image: perldocker/perl-tester:5.42
    steps:
      - uses: actions/checkout@v6
      - name: Allow for file ownership conflicts with Docker and GitHub Actions
        run: git config --global --add safe.directory '*'
      - name: Install Dist::Zilla deps
        run: |
          cpanm -n Dist::Zilla
          dzil authordeps --missing | cpanm -n
          dzil listdeps --develop --missing | cpanm -n
      - name: Build distribution
        run: dzil build --in build_dir
      # GH#132: [MinimumPerl] scans lib/ and copies its verdict into the
      # configure phase, so configure could say perl 5.010 while runtime said
      # 5.014, and the shipped Makefile.PL would open with use 5.010. Nothing
      # noticed until someone read the generated file. Core JSON::PP only.
      - name: Check every phase declares the runtime perl floor
        run: |
          perl -MJSON::PP -e '
            my $meta = decode_json(do { local (@ARGV, $/) = "build_dir/META.json"; <> });
            my $floor = $meta->{prereqs}{runtime}{requires}{perl} or die "no runtime perl in META.json\n";
            my @bad = grep { ($meta->{prereqs}{$_}{requires}{perl} // q{}) ne $floor } qw(configure test);
            my $mpl = do { local (@ARGV, $/) = "build_dir/Makefile.PL"; <> };
            push @bad, "Makefile.PL use line" unless $mpl =~ /^use \Q$floor\E;$/m;
            push @bad, "MIN_PERL_VERSION" unless $mpl =~ /"MIN_PERL_VERSION" => "\Q$floor\E"/;
            die "perl $floor missing from: @bad\n" if @bad;
          '
      - uses: actions/upload-artifact@v7
        with:
          name: build_dir
          path: build_dir
          if-no-files-found: error

  test_linux:
    runs-on: ubuntu-latest
    name: Perl ${{ matrix.perl-version }} on ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - "5.14"
          - "5.16"
          - "5.18"
          - "5.20"
          - "5.22"
          - "5.24"
          - "5.26"
          - "5.28"
          - "5.30"
          - "5.32"
          - "5.34"
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}
      env:
        AUTHOR_TESTING: 1
    steps:
      - name: Decide if we need to install recommended modules
        id: with-recommends
        if: matrix.perl-version >= 5.14
        run: echo 'flag=--with-recommends' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      - uses: perl-actions/setup-cpm@v1
        with:
          version: compat
      - name: Install deps
        if: success()
        run: >
          cpm install -g
          --cpanfile cpanfile
          --with-develop
          ${{ steps.with-recommends.outputs.flag }}
          --with-suggests
          --show-build-log-on-failure
      - name: Build and test the distribution
        if: success()
        run: |
          perl Makefile.PL
          make
          perl -Mblib -MNetAddr::IP::Util -e 'my $mode = NetAddr::IP::Util::mode(); $mode eq q{CC XS} or die "built $mode, expected CC XS\n"'
          make test

  test_linux_pureperl:
    runs-on: ubuntu-latest
    name: Perl ${{ matrix.perl-version }} on ubuntu-latest (pure Perl)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - "5.14"
          - "5.28"
          - "5.42"
    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}
      env:
        AUTHOR_TESTING: 1
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      - uses: perl-actions/setup-cpm@v1
        with:
          version: compat
      - name: Install deps
        if: success()
        run: >
          cpm install -g
          --cpanfile cpanfile
          --with-develop
          --with-recommends
          --with-suggests
          --show-build-log-on-failure
      - name: Build and test the distribution without XS
        if: success()
        run: |
          perl Makefile.PL -noxs
          make
          perl -Mblib -MNetAddr::IP::Util -e 'my $mode = NetAddr::IP::Util::mode(); $mode eq q{Pure Perl} or die "built $mode, expected Pure Perl\n"'
          make test

  test_macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "macos-15", "macos-15-intel", "macos-26-intel"]
        perl-version:
          - "5.24"
          - "5.26"
          - "5.28"
          - "5.30"
          - "5.32"
          - "5.34"
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
    name: Perl ${{ matrix.perl-version }} on ${{ matrix.os }}
    # Phase 2: starts once every Linux leg, XS and pure Perl, has passed.
    needs: [test_linux, test_linux_pureperl]
    steps:
      - uses: actions/checkout@v6
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
      - name: Decide if we need to install recommended modules
        id: with-recommends
        if: matrix.perl-version >= 5.14
        run: echo 'flag=--with-recommends' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      - run: perl -V
      - uses: perl-actions/setup-cpm@v1
        with:
          version: compat
      - name: install deps using cpm
        # slow Intel runners overrun the 60 second configure limit, and mirror
        # fetches fail now and then; a second attempt installs only what is missing
        run: |
          for attempt in 1 2; do
            [ "$attempt" = 1 ] || sleep 30
            cpm install -g --cpanfile cpanfile \
              --with-develop \
              ${{ steps.with-recommends.outputs.flag }} \
              --with-suggests \
              --with-test \
              --configure-timeout=300 \
              --show-build-log-on-failure \
              --mirror https://cpan.metacpan.org && exit 0
            echo "cpm install failed on attempt $attempt"
          done
          exit 1
      - name: Build and test the distribution
        # A plain perl Makefile.PL builds the XS on macOS, as on Linux. Assert it,
        # so a pure Perl fallback or a change to the platform list fails here.
        run: |
          perl Makefile.PL
          make
          perl -Mblib -MNetAddr::IP::Util -e 'my $mode = NetAddr::IP::Util::mode(); $mode eq q{CC XS} or die "built $mode, expected CC XS\n"'
          make test
        env:
          AUTHOR_TESTING: 1

  test_windows_pureperl:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]
        perl-version: ["5.24", "5.26", "5.28", "5.30"]
    name: "Perl ${{ matrix.perl-version }} on ${{ matrix.os }} (pure Perl)"
    needs: [test_linux, test_linux_pureperl]
    steps:
      - uses: actions/checkout@v6
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      # No shell: bash anywhere in this job. Git Bash prepends its own
      # /usr/bin to PATH, where there is a Cygwin perl 5.42.3 with no
      # ExtUtils::MakeMaker, so every step ran against the wrong perl and
      # the installer reported a core module as missing.
      #
      # cpm via the setup action, not cpm as a separate step and not cpanm.
      # The separate setup-cpm step ships a cpm that needs installing first.
      # cpanm ran and appeared to succeed, 49 distributions, but silently
      # skipped three: Test::CPAN::Meta, Test::EOL and Test::NoBreakpoints
      # were fetched and configured and never installed, which left three
      # author tests unable to load. This route gets all of them.
      #
      # --with-develop is required, not optional. The build_dir artifact
      # contains five author tests whose prerequisites are in the develop
      # phase of the cpanfile, and the disabled job never installed them.
      - name: install deps
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry
          install-modules-with: cpm
          install-modules-args: --with-develop --with-recommends --with-suggests
      - name: which perl is in use
        run: |
          (Get-Command perl).Source
          perl -V:version -V:archname -V:osname
          perl -MExtUtils::MakeMaker -e 'print "EUMM $ExtUtils::MakeMaker::VERSION\n"'
      - name: Build and test the distribution
        # Pure Perl only, so the runner needs no C toolchain. Strawberry Perl
        # ships a compiler, but nothing here should pay for building XS.
        #
        # MAKE=gmake, and gmake to run it, because the flavour EUMM picks
        # by default depends on the perl: 5.24 says "Generating a
        # dmake-style Makefile" and 5.26 says "Generating a gmake-style
        # Makefile". Strawberry also warns that dmake is no longer part of
        # the distribution and to use gmake instead, so gmake is the flavour
        # to ask for on every version. EUMM reads the MAKE value's basename
        # when deciding which quirks to apply, so this is the documented way
        # to pin it, and MAKE is recorded in the generated Makefile and in
        # its own distdir rule, so a rebuild from the tarball keeps it.
        #
        # dmake over this fails on 5.24 with "gmake: *** [blibdirs] Error 2",
        # and gmake over it fails the other way round, so neither works
        # across the matrix without pinning the flavour.
        run: |
          # pwsh fails the step on the last command only, so each one checks its own exit code
          perl Makefile.PL MAKE=gmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # No -noxs, because Windows builds pure Perl by default. Asserting it
          # checks the platform list in header.pl on Windows itself.
          perl -Mblib -MNetAddr::IP::Util -e 'my $mode = NetAddr::IP::Util::mode(); $mode eq q{Pure Perl} or die "built $mode, expected Pure Perl\n"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gmake test
        # No AUTHOR_TESTING here, unlike every other job. The five
        # author-*.t files guard on it and skip without it, and one of them
        # cannot pass on this platform: Test::EOF walks the working
        # directory with File::Find, and actions-setup-perl installs
        # dependencies into local/lib/perl5 inside the working directory,
        # so the check was reading other people's modules and failing on
        # Data::Binary's trailing newlines.
        #
        # Test::EOF takes only newline options, no file list and no finder,
        # and the [Test::EOF] plugin has no attribute to give it one, so
        # this cannot be configured away in dist.ini. The skip added there
        # is for the EOLFiles finder, which is the other of the two, and is
        # still needed for the same reason.
        #
        # --with-develop above is still required. The four release-*.t
        # tests do not guard on AUTHOR_TESTING, they run either way, and
        # they need the develop phase: kwalitee, pause-permissions,
        # unused-vars and test-legal all live there. They pass on Windows.

  # The other Windows job is pure Perl by design, which leaves the XS build
  # untested under threads anywhere in CI: Windows is the only platform whose
  # perls always have ithreads, since setup-perl ignores multi-thread there.
  # This covers that without compiling perl, which the Linux jobs cannot do
  # cheaply.
  test_windows_xs:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest"]
        # 5.30 only. 5.40 cannot install the recommends set: Socket6 0.29
        # fails to compile on Strawberry Perl 5.40.4, and that takes the
        # install step down before this job builds anything. It is Socket6's
        # bug, not ours, reported upstream as rt #181874 and cross
        # referenced to rt #140028, which is the same inet_ntop conflict from
        # a different angle and has been open four years. Widen this once
        # upstream is fixed, or once this job stops installing recommends.
        perl-version: ["5.30"]
    name: "Perl ${{ matrix.perl-version }} on ${{ matrix.os }} (XS)"
    needs: [test_linux, test_linux_pureperl]
    steps:
      - uses: actions/checkout@v6
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      # No shell, and cpm through the setup action, for the reasons given in
      # test_windows_pureperl: Git Bash puts a Cygwin perl ahead on PATH, and
      # a standalone cpanm silently skipped three author-test prerequisites.
      - name: install deps
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry
          install-modules-with: cpm
          install-modules-args: --with-develop --with-recommends --with-suggests
      - name: which perl is in use
        run: |
          (Get-Command perl).Source
          perl -V:version -V:archname -V:osname
          perl -MExtUtils::MakeMaker -e 'print "EUMM $ExtUtils::MakeMaker::VERSION\n"'
      - name: Build and test the distribution with XS
        # pwsh fails the step on the last command only, so each checks its own.
        run: |
          perl Makefile.PL --xs MAKE=gmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Windows defaults to pure Perl, so assert the flag took, or this
          # job could pass as a duplicate of test_windows_pureperl.
          perl -Mblib -MNetAddr::IP::Util -e 'my $mode = NetAddr::IP::Util::mode(); $mode eq q{CC XS} or die "built $mode, expected CC XS\n"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The point of this job: assert ithreads are there, so a green run
          # cannot come from t/260-threads.t taking its skip path.
          perl -Mthreads -MConfig -e 'exit $Config{useithreads} ? 0 : die "built $^V without ithreads\n"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gmake test
        # No AUTHOR_TESTING, for the reason given in test_windows_pureperl:
        # Test::EOF fails on this platform. --with-develop is still needed for
        # the release-*.t tests, which do not guard on it.

  # Phase 3: the BSDs, each in a QEMU VM on an Ubuntu runner through
  # vmactions, once Linux, macOS and Windows have passed. Every VM builds and
  # tests both builds from fresh copies of build_dir. The perl is the one the
  # OS packages; Linux covers the perl versions. Author tests check file
  # contents, which Linux already does, so AUTHOR_TESTING is off here and the
  # develop phase is not installed. The recommends installed are this
  # distribution's own: cpanm's --with-recommends follows every dependency's,
  # down to Alien::cmake3, whose build from source fails on the BSDs.
  test_bsd:
    runs-on: ubuntu-latest
    name: ${{ matrix.os }} ${{ matrix.release }}
    needs: [test_macos, test_windows_pureperl, test_windows_xs]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, release: "15.1" }
          - { os: freebsd, release: "14.5" }
          # NetBSD 11.0 is off until its t/260-threads.t failure is understood:
          # worker threads lose addresses in compactref on its perl 5.44.0
          # - { os: netbsd, release: "11.0" }
          - { os: openbsd, release: "7.9" }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: build_dir
      - name: Write the script the VM runs
        # Outside build_dir, so the distribution under test gains no file.
        run: |
          cat > test-both-builds.sh <<'EOF'
          #!/bin/sh
          # Builds and tests XS and pure Perl, each from a fresh copy of build_dir
          set -eu
          uname -a
          perl -V:version -V:archname -V:cc -V:byteorder
          for build in xs pp; do
              dir="/tmp/naip-$build"
              rm -rf "$dir"
              cp -R build_dir "$dir"
              cd "$dir"
              if [ "$build" = xs ]; then
                  perl Makefile.PL
                  expected='CC XS'
              else
                  perl Makefile.PL -noxs
                  expected='Pure Perl'
              fi
              make
              EXPECTED="$expected" perl -Mblib -MNetAddr::IP::Util -e 'my $mode = NetAddr::IP::Util::mode(); $mode eq $ENV{EXPECTED} or die "built $mode, expected $ENV{EXPECTED}\n"'
              make test
              cd "$GITHUB_WORKSPACE"
          done
          EOF
      - name: Test on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          cache-after-prepare: true
          cache-after-prepare-key-suffix: deps-${{ hashFiles('build_dir/cpanfile') }}
          prepare: |
            pkg install -y perl5 p5-App-cpanminus
            cd build_dir && cpanm -n --installdeps . && cpanm -n 'Math::BigInt~1.99' Socket6
          run: sh test-both-builds.sh
      - name: Test on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          cache-after-prepare: true
          cache-after-prepare-key-suffix: deps-${{ hashFiles('build_dir/cpanfile') }}
          prepare: |
            /usr/sbin/pkg_add -u perl p5-App-cpanminus
            cd build_dir && /usr/pkg/bin/cpanm -n --installdeps . && /usr/pkg/bin/cpanm -n 'Math::BigInt~1.99' Socket6
          run: PATH="/usr/pkg/bin:$PATH" sh test-both-builds.sh
      - name: Test on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          cache-after-prepare: true
          # The prepare text is in the cache key, so it carries the cpanfile hash.
          # OpenBSD packages no cpanminus, so its base ftp fetches it.
          prepare: |
            # cpanfile ${{ hashFiles('build_dir/cpanfile') }}
            ftp -o /usr/local/bin/cpanm https://cpanmin.us
            chmod +x /usr/local/bin/cpanm
            cd build_dir && cpanm -n --installdeps . && cpanm -n 'Math::BigInt~1.99' Socket6
          run: sh test-both-builds.sh
