name    = NetAddr-IP
author  = Luis E. Muñoz <luismunoz@cpan.org>
author  = Michael Robinton <miker@cpan.org>
license = Perl_5
copyright_holder = Luis E. Muñoz, Michael Robinton
copyright_year   = 2026
main_module = lib/NetAddr/IP.pm
version = 4.080_01

[@Filter]
-bundle = @Basic
-remove = GatherDir
-remove = MakeMaker
-remove = Readme

[PruneCruft]

[MetaProvides::Package]
[MetaJSON]
[MetaTests]
[MetaNoIndex]
directory = t
package = NetAddr::IP::UtilPolluted

[Git::GatherDir]
exclude_filename = MANIFEST
exclude_filename = MANIFEST.SKIP
exclude_filename = Makefile.PL

[GithubMeta]
issues = 1

[CPANFile]
[MinimumPerl]

[Test::Kwalitee]
[Test::Compile]
[Test::EOF]
[FileFinder::ByName / EOLFiles]
skip = ^t/data/
skip = ^docs/
[Test::EOL]
finder = EOLFiles
[Test::PAUSE::Permissions]
[Test::ReportPrereqs]
[Test::UnusedVars]
[Test::NoBreakpoints]
[Test::Legal]
[PodSyntaxTests]
[PkgVersion]
die_on_existing_version = 1
[PodWeaver]
[RunExtraTests]
[NextRelease]
[CheckChangeLog]

[MakeMaker::Awesome]
header_file = inc/MakeMaker/header.pl
footer_file = inc/MakeMaker/footer.pl
WriteMakefile_arg = @mm_args

[PruneFiles]
match = ^dist\.ini
match = ^\.github/
filename = .editorconfig
filename = .gitignore
filename = MANIFEST.SKIP
filename = PLAN.md
filename = AGENTS.md

[Clean]

[Prereqs]
AutoLoader = 0
Carp = 0
DynaLoader = 0
Exporter = 0
overload = 0
perl = 5.008001
Socket = 0
Socket6 = 0
strict = 0
vars = 0
warnings = 0

[Prereqs / TestRequires]
Config = 0
Test2::Require::Internet = 0
Test2::Tools::Exception = 0
Test2::V1 = 0

[Git::CheckFor::CorrectBranch]
[Git::Remote::Check]
[Git::Tag]
