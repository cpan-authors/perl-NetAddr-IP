name    = NetAddr-IP
author  = Dean Hamstead <dean@fragfest.com.au>
author  = Luis E. Muñoz <luismunoz@cpan.org>
author  = Michael Robinton <michael@bizsystems.com>
license = MIT
copyright_holder = Dean Hamstead, Luis E. Muñoz, Michael Robinton
copyright_year   = 2026
main_module = lib/NetAddr/IP.pm
version = 4.080_06

[@Filter]
-bundle = @Basic
-remove = GatherDir
-remove = License
-remove = MakeMaker
-remove = Readme

[PruneCruft]

[MetaProvides::Package]
[MetaJSON]
[MetaTests]
[MetaNoIndex]
directory = t

[Git::GatherDir]
exclude_filename = MANIFEST
exclude_filename = MANIFEST.SKIP

[GithubMeta]
issues = 1

[CPANFile]
[MinimumPerl]

[Test::Kwalitee]
[Test::Compile]
[Test::EOF]
[FileFinder::ByName / EOLFiles]
skip = ^t/data/
skip = ^local/
[Test::EOL]
finder = EOLFiles
[Test::PAUSE::Permissions]
[Test::ReportPrereqs]
[Test::UnusedVars]
[Test::NoBreakpoints]
[Test::Legal]
[PodSyntaxTests]
[OurPkgVersion]
[PodWeaver]
[RunExtraTests]
[NextRelease]
[Test::CPAN::Changes]

[PruneFiles]
match = ^dist\.ini
match = ^\.github/
filename = .editorconfig
filename = .gitignore
filename = .mailmap
filename = MANIFEST.SKIP
filename = AGENTS.md
filename = weaver.ini

[Clean]

[Prereqs]
Carp = 0
DynaLoader = 0
Exporter = 0
overload = 0
parent = 0
perl = 5.014
Scalar::Util = 0
Socket = 0
strict = 0
warnings = 0

[Prereqs / ConfigureRequires]
ExtUtils::CBuilder = 0
; same floor as runtime, above the 5.010 that [MinimumPerl] copies from its lib/ scan
perl = 5.014

[Prereqs / RuntimeRecommends]
Math::BigInt = 1.99

[Prereqs / TestRequires]
Config = 0
ExtUtils::Manifest = 0
Test2::Mock = 0
Test2::Plugin::NoWarnings = 0
Test2::Require::Internet = 0
Test2::Tools::Exception = 0
Test2::Tools::Warnings = 0
Test2::V1 = 0

; after every [Prereqs] section, as the Makefile.PL perl floor comes from the prereqs above it
[MakeMaker::Awesome]
header_file = inc/MakeMaker/header.pl
footer_file = inc/MakeMaker/footer.pl
WriteMakefile_arg = @mm_args

[Git::CheckFor::CorrectBranch]
[Git::Remote::Check]
[Git::Tag]
